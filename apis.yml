name: TranscriptFetch
description: >-
  Social video & audio to text API for builders. Returns timestamped, structured JSON transcripts for YouTube, TikTok,
  Instagram, Spotify, Apple Podcasts, and direct media files — captions when available, AI audio transcription as
  fallback — plus YouTube channel/playlist/search discovery. Delivered via REST and a hosted MCP server for LLM
  pipelines, RAG, and agents.
