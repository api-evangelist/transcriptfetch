apis:
  - name: TranscriptFetch REST API
    description: >-
      REST API (current version v2, path-prefixed) for fetching timestamped transcripts from YouTube, TikTok, Instagram,
      Spotify, Apple Podcasts, podcast RSS feeds, and direct media files, with AI audio transcription when captions are
      missing, plus YouTube channel/playlist/search discovery, batch up to 500, async jobs with polling or signed
      callbacks, cursor pagination, Idempotency-Key replay, and credit-based billing where failures are free. Auth via
      bearer API key (tf_live_...); a hosted MCP server at /mcp exposes the same surface as five tools over OAuth or
      API key.
