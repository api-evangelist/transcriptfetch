billing_notes:
- Annual billing is 10 months for 12 (2 months free).
- Top-ups without a plan are $10 per 1,000 credits.
- 30-day first-month money-back guarantee (after >=100 fetches); every request is delivered-or-free.
- Running out returns 402 insufficient_credits — no surprise overage billing.
- Cancellation is self-serve; a cancelled plan runs to period end, top-up credits are kept forever.
