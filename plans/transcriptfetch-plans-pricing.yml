metering: >-
  Credit-based; 1 credit = one successful response (a caption transcript or one listing
  page). AI audio transcription (no captions) is 1 credit per started minute, minimum 1,
  billed only on delivery (4-hour cap = 240 credits). Failed, blocked, or empty results,
  job polling, /me balance checks, and since_video_id channel polls with nothing new are
  free. Unused paid-plan credits roll over up to 2x the monthly allowance; top-up credits
  never expire and sit outside the cap.
