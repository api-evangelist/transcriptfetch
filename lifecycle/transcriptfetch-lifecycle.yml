  legacy: Older unversioned /api/transcripts routes still work.
  breaking_change_policy: >-
    Inside a version prefix nothing is removed, renamed, retyped, or made newly required,
    and existing error codes keep their meaning and number. Breaking changes ship as a
    new version prefix with the old one kept working. Additive changes (new endpoints,
    optional fields, response fields, new error codes with new numbers) ship any time
    without notice.
deprecation:
  policy: >-
    At least 12 months' notice from announcement to shutdown of any retired version,
    announced in the changelog, by email to accounts that called the affected endpoint in
    the previous 90 days, and with a Deprecation response header (RFC 8594-style) on the
    affected endpoints.
